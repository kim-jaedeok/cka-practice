apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kz-staging
namePrefix: stg-
resources:
  - ../base
labels:
  - pairs:
      app.kubernetes.io/part-of: catalog
    includeSelectors: false
replicas:
  - name: catalog
    count: 2
images:
  - name: ngnix
    newTag: "1.29"
configMapGenerator:
  - name: catalog-settings
    literals:
      - MODE=staging
patches:
  - path: patch-env.yaml
