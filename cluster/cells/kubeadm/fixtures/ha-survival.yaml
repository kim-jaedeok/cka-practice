apiVersion: v1
kind: Namespace
metadata:
  name: ha-survival
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: survival-web
  namespace: ha-survival
  labels:
    app: survival-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: survival-web
  template:
    metadata:
      labels:
        app: survival-web
    spec:
      nodeSelector:
        cka-practice/survival: "true"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: survival-web
      containers:
        - name: web
          image: nginx:1.29
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: survival-web
  namespace: ha-survival
spec:
  selector:
    app: survival-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: network-client
  namespace: ha-survival
spec:
  nodeSelector:
    cka-practice/survival: "true"
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 86400"]
