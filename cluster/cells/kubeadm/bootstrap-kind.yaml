# Disposable kubeadm bootstrap cell.  The cluster is first created by kind so
# the exact pinned node image and kindnet manifest are available locally, then
# every node is reset to a verified pre-kubeadm state.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  podSubnet: "10.244.0.0/16"
nodes:
  - role: control-plane
  - role: worker
  - role: worker
